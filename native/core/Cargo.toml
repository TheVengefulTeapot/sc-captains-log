[package]
name = "cl_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"], optional = true }
napi-derive = "2"
serde_json = { version = "1", features = ["preserve_order"] }
native-tls = "0.2"
aho-corasick = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }

[features]
# "node" builds the Electron native module; the Tauri app turns it off.
default = ["node"]
node = ["dep:napi"]
# With "node" off, #[napi] attributes do nothing (napi-derive's noop mode).
plain = ["napi-derive/noop"]

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
